user www-data;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # 性能优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 16k;

    # 接口限速（按客户端 IP）。map 结果为空时不计数，只对指定接口生效。
    map $uri $lec_create_limit_key {
        /api/create_order.php $binary_remote_addr;
        default "";
    }
    map $uri $lec_query_limit_key {
        /api/query_order.php $binary_remote_addr;
        default "";
    }
    limit_req_zone $lec_create_limit_key zone=lec_create:10m rate=10r/m;
    limit_req_zone $lec_query_limit_key zone=lec_query:10m rate=60r/m;
    limit_req_status 429;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # 包含站点配置
    include /etc/nginx/http.d/*.conf;
}
